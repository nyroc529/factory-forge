[package]
name = "factory-forge"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.14"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

# Full speed for the sim even in dev builds.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
