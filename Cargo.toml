[package]
name = "factory-forge"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.14", features = ["wav"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

# Full speed for the sim even in dev builds.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
